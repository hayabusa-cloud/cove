name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bench:
        description: Benchmark filter
        default: '^Benchmark(Temporal|ForcingTransition)'
        type: string
      benchtime:
        description: Duration per benchmark
        default: '200ms'
        type: string
      count:
        description: Repetitions
        default: 10
        type: number

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '1'
      BENCH: ${{ inputs.bench }}
      BENCHTIME: ${{ inputs.benchtime }}
      COUNT: ${{ inputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Record environment
        run: |
          go version
          go env GOOS GOARCH GOEXPERIMENT
          go list -m all
          uname -srmo
          lscpu
          printf 'GOMAXPROCS=%s\n' "$GOMAXPROCS"

      - name: Measure
        run: >-
          go test -mod=readonly -run '^$' -bench "${BENCH:-^Benchmark(Temporal|ForcingTransition)}"
          -benchmem -benchtime="${BENCHTIME:-200ms}" -count="${COUNT:-10}" -timeout=120s .
