name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27', 'stable']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check formatting, modules, and vet
        run: make check

      - name: Test with race detection
        run: go test -timeout 120s -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.go-version == '1.27'
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: go build ./...

      - name: Cross-architecture build
        run: |
          for arch in amd64 arm64 riscv64 loong64; do
            echo "Building for linux/$arch..."
            GOOS=linux GOARCH=$arch go build ./...
          done
